{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
  <!-- Page heading -->
  <h2 class="mb-4">Add New Player</h2>

  <!-- Player creation form -->
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <!-- Render form fields (e.g. name, age, height, injuries, etc.) -->
    {{ form.as_p }}

    <!-- Submit button -->
    <button type="submit" class="btn btn-primary">Save Player</button>
  </form>
</div>
{% endblock %}
